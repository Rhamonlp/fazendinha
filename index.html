function openP(id){S.paused=true;jr();$(id).style.display='flex';if(id=='inv')$('invc').innerHTML=`🌰 Sementes: ${S.seeds}<br>🍉 Melancias: ${S.harv}<br>💰 Moedas: ${S.money}<br>📅 Dia ${S.day}<br>❤️ ${S.hp}/5 · 🍖 ${S.food}/5`}

function buy(){if(!near())return;if(S.money<10)return toast('Faltam moedas!');S.money-=10;S.seeds+=5;hud()}
function front(){const d=DIR[P.dir];return[(P.x/T|0)+d[0],(P.y/T|0)+d[1]]}
function act(){if(S.paused)return;
 if(S.tool==4){if(S.harv<1)return toast('Sem melancias!');if(S.food>=5)return toast('Barriga cheia!');S.harv--;S.food++;return hud()}
 const[x,y]=front();if(x<0||y<0||x>=W||y>=H||(x==CHEST.x&&y==CHEST.y))return;
 const k=x+','+y,c=crop[k];
 if(S.tool==0&&!c&&soil[y][x]==0)soil[y][x]=1;
 else if(S.tool==1&&soil[y][x]>0&&!c&&S.seeds>0){S.seeds--;crop[k]={s:0,w:soil[y][x]==2}}

function nextDay(){S.day++;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(soil[y][x]==2)soil[y][x]=1;

 if(P.moving){if(dx&&dy){dx*=.707;dy*=.707}
  P.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  const sp=90*dt,nx=P.x+dx*sp,ny=P.y+dy*sp;
  if(ok(nx,P.y))P.x=nx;if(ok(P.x,ny))P.y=ny;
  P.ft+=dt;if(P.ft>.12){P.ft=0;P.f=(P.f+1)%4}}else{P.ft+=dt;if(P.ft>.4){P.ft=0;P.f=(P.f+1)%4}}

  g.fillRect(x*T,y*T,T,T);
  if(soil[y][x]){g.drawImage(IT,x*T,y*T,T,T);if(soil[y][x]==2){g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x*T,y*T,T,T)}}}
 for(const[fx,fy,a]of flowers){if(soil[fy/T|0][fx/T|0])continue;g.fillStyle=a?'#ffe36b':'#fff';g.fillRect(fx,fy,2,2)}
 for(const k in crop){const[x,y]=k.split(',').map(Number),c=crop[k],o=[[1,-1],[1,-3],[0,-4]][c.s];g.drawImage(IM,c.s*16,0,16,16,x*T+o[0],y*T+o[1],T,T)}
 const cx=CHEST.x*T,cy=CHEST.y*T;g.fillStyle='#7a4a1e';g.fillRect(cx+2,cy+8,28,20);
 g.fillStyle='#a8692c';g.fillRect(cx+2,cy+8,28,8);g.fillStyle='#ffd36b';g.fillRect(cx+14,cy+14,4,6);
 if(S.tool<4){const[fx,fy]=front();g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;g.strokeRect(fx*T+1,fy*T+1,T-2,T-2)}
 const row=P.moving?ROW[P.dir]:(P.dir=='down'?ROW.idle:ROW[P.dir]),f=P.moving||P.dir=='down'?P.f:0;
 g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(P.x,P.y+9,8,3,0,0,7);g.fill();
 g.drawImage(img,f*32,row*32,32,32,Math.round(P.x-16),Math.round(P.y-24),32,32);
 const p=S.t/DAYLEN,n=p>.7?(p-.7)/.3*.55:p<.05?(1-p/.05)*.3:0;
 if(n>0){g.fillStyle=`rgba(10,20,60,${n})`;g.fillRect(0,0,640,480)}
 g.restore()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;
 if(k>='1'&&k<='6')S.tool=+k-1,hud();
 if(k===' '||k==='e')act();if(k==='v')sell();if(k==='b')buy();
 if(k==='escape')S.paused?closeP():openP('cfg');
 if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('contextmenu',e=>e.preventDefault());
const jb=$('jb'),jk=$('jk');
function jm(e){const r=jb.getBoundingClientRect(),R=r.width/2,vx=e.clientX-(r.left+R),vy=e.clientY-(r.top+R),m=Math.hypot(vx,vy)||1,l=Math.min(m,R*.6);
 jk.style.transform=`translate(${vx/m*l}px,${vy/m*l}px)`;
 joy.x=Math.abs(vx)>R*.25?Math.sign(vx):0;joy.y=Math.abs(vy)>R*.25?Math.sign(vy):0}
function jr(){joy.x=joy.y=0;jk.style.transform=''}
jb.addEventListener('pointerdown',e=>{jb.setPointerCapture(e.pointerId);jm(e)});
jb.addEventListener('pointermove',e=>{if(jb.hasPointerCapture(e.pointerId))jm(e)});
jb.addEventListener('pointerup',jr);jb.addEventListener('pointercancel',jr);
const bind=(id,fn)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()});
bind('bA',act);bind('bS',sell);bind('bB',buy);bind('menu',()=>openP('cfg'));
for(const id of['inv','cfg'])$(id).addEventListener('pointerdown',e=>{if(e.target.id===id)closeP()});
let last=performance.now();hud();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(!S.paused)update(dt);draw();requestAnimationFrame(loop)})(last);
